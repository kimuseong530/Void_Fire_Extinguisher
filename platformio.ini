[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    adafruit/Adafruit MPU6050@^2.2
    adafruit/Adafruit Unified Sensor@^1.1
    thomasfredericks/Bounce2@^2.7
